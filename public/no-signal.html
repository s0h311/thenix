<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fafaf9"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0c0a09"
    />
    <title>thenix</title>
    <style>
      /* Static on purpose: this page has to work with nothing else loaded. Colours are the tokens in app/index.css. */
      :root {
        color-scheme: light dark;
        --page: #fafaf9;
        --ink: #1c1917;
        --ink-muted: #57534e;
        --brand: #fbbf24;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0c0a09;
          --ink: #f5f5f4;
          --ink-muted: #d6d3d1;
          --brand: #fcd34d;
        }
      }

      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 0.75rem;
        min-height: 100dvh;
        margin: 0;
        padding: calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
        background: var(--page);
        color: var(--ink);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        line-height: 2rem;
        letter-spacing: -0.02em;
        font-weight: 600;
      }

      p {
        margin: 0;
        color: var(--ink-muted);
      }

      button {
        align-self: center;
        margin-top: 0.75rem;
        padding: 0.625rem 1.5rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--brand);
        color: #0c0a09;
        font: inherit;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>No signal.</h1>
    <p>thenix needs a connection to open.</p>
    <button
      type="button"
      onclick="location.reload()"
    >
      Retry
    </button>
  </body>
</html>
